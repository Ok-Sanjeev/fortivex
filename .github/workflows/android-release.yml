name: Build Android Release Bundle (AAB & APK)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Bundle & APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies & Run Verification Tests
        run: |
          npm ci || npm install
          npm test

      - name: Prepare Web Assets for Android
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html styles.css game.js ui.js audio.js ranks.js icons/ privacy.html manifest.json android/app/src/main/assets/ || true

      - name: Build Android App Bundle (AAB) & APK
        working-directory: android
        run: |
          gradle bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Upload Release Android App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: fortivex-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: fortivex-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
